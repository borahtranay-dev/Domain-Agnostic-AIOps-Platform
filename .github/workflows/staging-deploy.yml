name: Staging Deployment & Automated Rollback Pipeline

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  staging-validation:
    name: Staging Architecture & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Staging Docker Compose Syntax
        run: |
          docker compose -f docker-compose.staging.yml config --quiet
          echo "Staging Compose syntax verified cleanly."

  staging-rollback-verification:
    name: Staging Rollback Engine & Safety Invariants
    runs-on: ubuntu-latest
    needs: [staging-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install -r tests/requirements-test.txt

      - name: Run Staging Deployment & Rollback Test Suite
        run: |
          pytest tests/test_p10_staging_rollback.py -v

      - name: Verify Live Staging Rollback Simulation
        run: |
          python scripts/simulate_p10_staging_rollback.py

